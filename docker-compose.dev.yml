# Local development database only: `docker compose -f docker-compose.dev.yml up -d`, then `npm run dev`.
name: retroplay-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: retroplay
      POSTGRES_USER: retroplay
      POSTGRES_PASSWORD: retroplay
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data

volumes:
  pgdata-dev:
