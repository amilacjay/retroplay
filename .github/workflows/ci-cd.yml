name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/retroplay-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/retroplay-web

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  images:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: docker/api.Dockerfile
          - name: web
            dockerfile: docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/retroplay-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/retroplay-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: images
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          # Host and user are not sensitive, so a repository/environment variable works as well as a secret.
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
        # Secrets pasted from Windows can carry \r or stray spaces; normalise them, then fail with a readable (non-secret) reason.
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' | sed -e 's/^[[:space:]]*//' > ~/.ssh/known_hosts
          host=$(printf '%s' "$DEPLOY_HOST" | tr -d '\r\n[:space:]'); user=$(printf '%s' "$DEPLOY_USER" | tr -d '\r\n[:space:]')
          for name in DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_HOST DEPLOY_USER; do [ -n "${!name//[[:space:]]/}" ] || { echo "::error::$name is empty or not visible to the production environment (check its exact name and that it is a secret or variable on this repo or its production environment)."; missing=1; }; done
          [ -z "${missing:-}" ] || exit 1
          echo "DEPLOY_TARGET=$user@$host" >> "$GITHUB_ENV"
          ssh-keygen -y -f ~/.ssh/deploy >/dev/null 2>&1 || { echo "::error::DEPLOY_SSH_KEY is not a readable private key (paste the whole file, including the BEGIN/END lines)."; exit 1; }
          ssh-keygen -F "$host" -f ~/.ssh/known_hosts >/dev/null || { echo "::error::DEPLOY_KNOWN_HOSTS has no entry for $host."; exit 1; }
          if ! out=$(ssh -i ~/.ssh/deploy -o BatchMode=yes -o ConnectTimeout=15 "$user@$host" true 2>&1); then
            echo "::error::SSH to $user@$host failed: $(printf '%s' "$out" | tail -1)"; exit 1
          fi
      - name: Upload compose file and deploy script
        run: scp -i ~/.ssh/deploy docker-compose.yml deploy/remote-deploy.sh "$DEPLOY_TARGET:apps/retroplay/"
      - name: Pull and restart
        # The job's GITHUB_TOKEN (read:packages) goes over SSH on stdin for one pull; the script logs out afterwards.
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/deploy "$DEPLOY_TARGET" \
            "IMAGE_TAG=${{ github.sha }} API_IMAGE=$API_IMAGE WEB_IMAGE=$WEB_IMAGE REGISTRY_USER=${{ github.actor }} bash apps/retroplay/remote-deploy.sh"
