# Production stack: Caddy (TLS + static web + reverse proxy) → NestJS API → Postgres.
# Configuration comes from .env next to this file (see .env.production.example). Only Caddy publishes ports.
name: retroplay

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: retroplay
      POSTGRES_USER: retroplay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retroplay -d retroplay"]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    image: ${API_IMAGE:-ghcr.io/amilacjay/retroplay-api}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: "3000"
      DATABASE_URL: postgres://retroplay:${POSTGRES_PASSWORD}@postgres:5432/retroplay
      WEB_ORIGIN: https://${SITE_ADDRESS}
      SPOTIFY_REDIRECT_URI: https://${SITE_ADDRESS}/auth/callback
      GOOGLE_REDIRECT_URI: https://${SITE_ADDRESS}/auth/google/callback
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:-ghcr.io/amilacjay/retroplay-web}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
